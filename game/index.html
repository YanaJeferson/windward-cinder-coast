<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windward: Cinder Coast</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1118; }
  #scene, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { touch-action: none; outline: none; filter: saturate(1.16) contrast(1.08) brightness(1.01); }
  #hud { pointer-events: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 46%, rgba(5,8,12,0.2) 100%);
    mix-blend-mode: multiply;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Windward: Cinder Coast, a coastal flight game"></canvas>
<canvas id="hud"></canvas>
<div id="vignette"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
